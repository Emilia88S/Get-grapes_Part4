<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Duck's Magical Grape Quest - Part 4</title>

<style>
    body {
        margin: 0;
        background: black;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    canvas {
        display: block;
        margin: auto;
        background: #78c850;
    }

    #hud {
        position: fixed;
        top: 15px;
        left: 15px;
        color: white;
        font-size: 20px;
        font-weight: bold;
        background: rgba(0,0,0,0.55);
        padding: 12px;
        border-radius: 10px;
        z-index: 5;
    }

    #bossHUD {
        position: fixed;
        top: 15px;
        right: 15px;
        color: white;
        font-size: 20px;
        font-weight: bold;
        background: rgba(0,0,0,0.65);
        padding: 12px;
        border-radius: 10px;
        display: none;
        z-index: 5;
    }

    #dialogue {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        width: 75%;
        background: rgba(0,0,0,0.85);
        color: white;
        padding: 18px;
        text-align: center;
        font-size: 22px;
        border-radius: 15px;
        display: none;
        z-index: 10;
    }

    #transition {
        position: fixed;
        inset: 0;
        background: black;
        color: white;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 55px;
        font-weight: bold;
        z-index: 100;
    }

    #ending {
        position: fixed;
        inset: 0;
        background: black;
        color: white;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        z-index: 200;
        text-align: center;
    }

    #ending h1 {
        font-size: 65px;
        margin: 10px;
    }

    #ending p {
        font-size: 25px;
    }
</style>
</head>

<body>

<canvas id="game" width="1100" height="720"></canvas>

<div id="hud">
    ❤️ HP: <span id="playerHP">100</span><br>
    🍇 Magic Power: <span id="power">100</span>
</div>

<div id="bossHUD">
    👹 LEMONADE GUY<br>
    ❤️ Boss HP: <span id="bossHealth">100</span>
</div>

<div id="dialogue"></div>

<div id="transition">
    <span id="transitionTitle"></span>
</div>

<div id="ending">
    <h1>PART 5 WAKE UP???</h1>
    <p>To be continued...</p>
</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const hud = document.getElementById("hud");
const bossHUD = document.getElementById("bossHUD");

const playerHPText = document.getElementById("playerHP");
const powerText = document.getElementById("power");
const bossHealthText = document.getElementById("bossHealth");

const dialogue = document.getElementById("dialogue");

const transition = document.getElementById("transition");
const transitionTitle = document.getElementById("transitionTitle");

const ending = document.getElementById("ending");


// ===============================
// GAME VARIABLES
// ===============================

let scene = "town";

let playerHP = 100;
let grapePower = 100;
let bossHP = 100;

let keys = {};

let player = {
    x: 250,
    y: 360,
    size: 35,
    speed: 5
};

let boss = {
    x: 850,
    y: 360,
    size: 55
};

let bossAttacks = [];
let playerAttacks = [];


// ===============================
// KEYBOARD
// ===============================

document.addEventListener("keydown", function(e) {

    keys[e.key.toLowerCase()] = true;

    // SPACE = attack
    if (
        e.key === " " &&
        scene === "battle" &&
        grapePower > 0
    ) {
        throwGrape();
    }
});

document.addEventListener("keyup", function(e) {
    keys[e.key.toLowerCase()] = false;
});


// ===============================
// DIALOGUE
// ===============================

function say(text, time = 3000) {

    dialogue.textContent = text;
    dialogue.style.display = "block";

    setTimeout(() => {
        dialogue.style.display = "none";
    }, time);
}


// ===============================
// UPDATE HUD
// ===============================

function updateHUD() {

    playerHPText.textContent = Math.max(0, playerHP);
    powerText.textContent = Math.max(0, grapePower);
    bossHealthText.textContent = Math.max(0, bossHP);

}


// ===============================
// DRAW PLAYER
// ===============================

function drawDuck() {

    ctx.font = "50px Arial";
    ctx.fillText("🦆", player.x - 25, player.y + 20);

}


// ===============================
// DRAW BOSS
// ===============================

function drawBoss() {

    ctx.font = "65px Arial";
    ctx.fillText("🍋", boss.x - 30, boss.y + 25);

    ctx.font = "18px Arial";
    ctx.fillStyle = "white";
    ctx.fillText(
        "LEMONADE GUY",
        boss.x - 65,
        boss.y - 45
    );

}


// ===============================
// DRAW GRAPES
// ===============================

function drawGrape(x, y) {

    ctx.font = "30px Arial";
    ctx.fillText("🍇", x - 15, y + 10);

}


// ===============================
// DRAW TOWN
// ===============================

function drawTown() {

    ctx.fillStyle = "#76c043";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Houses
    ctx.fillStyle = "#d88b5b";

    ctx.fillRect(80, 160, 180, 140);
    ctx.fillRect(820, 160, 180, 140);

    ctx.fillStyle = "#8b4513";

    ctx.beginPath();
    ctx.moveTo(60,160);
    ctx.lineTo(170,80);
    ctx.lineTo(280,160);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(800,160);
    ctx.lineTo(910,80);
    ctx.lineTo(1020,160);
    ctx.fill();

    // Trees
    ctx.font = "65px Arial";

    ctx.fillText("🌳", 350, 160);
    ctx.fillText("🌳", 680, 170);

    // Grapes everywhere
    drawGrape(300,500);
    drawGrape(450,250);
    drawGrape(650,500);
    drawGrape(780,300);

    ctx.fillStyle = "white";
    ctx.font = "30px Arial";
    ctx.fillText("🍇 GRAPE TOWN 🍇", 400, 70);

}


// ===============================
// DRAW BOSS REALM
// ===============================

function drawBattle() {

    // Dark background
    ctx.fillStyle = "#080010";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Purple ground
    ctx.fillStyle = "#180025";
    ctx.fillRect(0, 500, canvas.width, 220);

    // Strange objects
    ctx.font = "60px Arial";

    ctx.fillText("💀", 100, 250);
    ctx.fillText("🪨", 300, 450);
    ctx.fillText("💀", 950, 250);
    ctx.fillText("🪨", 700, 450);

    drawDuck();
    drawBoss();

    // Player grapes
    for (let attack of playerAttacks) {
        drawGrape(attack.x, attack.y);
    }

    // Lemon attacks
    for (let attack of bossAttacks) {

        ctx.font = "30px Arial";
        ctx.fillText("🍋", attack.x - 15, attack.y + 10);

    }

}


// ===============================
// MOVEMENT
// ===============================

function movePlayer() {

    if (scene !== "town" && scene !== "battle") {
        return;
    }

    if (
        keys["w"] ||
        keys["arrowup"]
    ) {
        player.y -= player.speed;
    }

    if (
        keys["s"] ||
        keys["arrowdown"]
    ) {
        player.y += player.speed;
    }

    if (
        keys["a"] ||
        keys["arrowleft"]
    ) {
        player.x -= player.speed;
    }

    if (
        keys["d"] ||
        keys["arrowright"]
    ) {
        player.x += player.speed;
    }

    // Keep player inside screen

    player.x = Math.max(
        30,
        Math.min(canvas.width - 30, player.x)
    );

    player.y = Math.max(
        50,
        Math.min(canvas.height - 30, player.y)
    );

}


// ===============================
// THROW GRAPE
// ===============================

function throwGrape() {

    if (grapePower <= 0) {
        return;
    }

    grapePower -= 5;

    playerAttacks.push({
        x: player.x + 30,
        y: player.y,
        speed: 8
    });

    updateHUD();

}


// ===============================
// BOSS ATTACK
// ===============================

function bossAttack() {

    if (scene !== "battle") {
        return;
    }

    bossAttacks.push({
        x: boss.x - 20,
        y: boss.y,
        speed: 4
    });

}


// ===============================
// UPDATE PLAYER ATTACKS
// ===============================

function updatePlayerAttacks() {

    for (let i = playerAttacks.length - 1; i >= 0; i--) {

        let attack = playerAttacks[i];

        attack.x += attack.speed;

        // Hit boss
        let distance = Math.hypot(
            attack.x - boss.x,
            attack.y - boss.y
        );

        if (distance < 55) {

            bossHP -= 10;

            playerAttacks.splice(i, 1);

            updateHUD();

            if (bossHP <= 0) {
                bossDefeated();
                return;
            }

            continue;
        }

        // Remove if off screen
        if (attack.x > canvas.width) {
            playerAttacks.splice(i, 1);
        }
    }

}


// ===============================
// UPDATE BOSS ATTACKS
// ===============================

function updateBossAttacks() {

    for (let i = bossAttacks.length - 1; i >= 0; i--) {

        let attack = bossAttacks[i];

        attack.x -= attack.speed;

        let distance = Math.hypot(
            attack.x - player.x,
            attack.y - player.y
        );

        if (distance < 45) {

            playerHP -= 10;

            bossAttacks.splice(i, 1);

            updateHUD();

            if (playerHP <= 0) {

                playerDied();

                return;
            }

            continue;
        }

        if (attack.x < 0) {
            bossAttacks.splice(i, 1);
        }
    }

}


// ===============================
// PLAYER DIES
// ===============================

function playerDied() {

    say("🦆 DUCK: NOOO! I have to try again!");

    setTimeout(() => {

        playerHP = 100;
        grapePower = 100;

        player.x = 200;
        player.y = 360;

        bossAttacks = [];
        playerAttacks = [];

        updateHUD();

        say("🦆 DUCK: I'm back! I won't give up!");

    }, 1500);

}


// ===============================
// BOSS DEFEATED
// ===============================

function bossDefeated() {

    scene = "town";

    bossHUD.style.display = "none";

    playerAttacks = [];
    bossAttacks = [];

    player.x = 550;
    player.y = 400;

    say(
        "🦆 DUCK: WE DID IT! The Lemonade Guy is defeated!",
        3500
    );

    setTimeout(() => {

        say(
            "🧙 Wizard: WAKE UP...",
            3500
        );

    }, 4000);

    setTimeout(() => {

        showPart5();

    }, 7500);

}


// ===============================
// START BOSS
// ===============================

function startBoss() {

    // IMPORTANT:
    // We change the scene to transition first.
    // This prevents the transition from getting stuck.

    scene = "transition";

    bossHUD.style.display = "none";

    transitionTitle.textContent = "FINAL BOSS";

    transition.style.display = "flex";


    // Wait 3 seconds
    setTimeout(() => {

        // Hide black screen
        transition.style.display = "none";

        // NOW actually start the boss fight
        scene = "battle";

        bossHUD.style.display = "block";

        // Reset everything
        player.x = 200;
        player.y = 360;

        boss.x = 850;
        boss.y = 360;

        playerHP = 100;
        grapePower = 100;
        bossHP = 100;

        playerAttacks = [];
        bossAttacks = [];

        updateHUD();

        say(
            "🍋 Lemonade Guy: HAHAHAHA! You finally found me!",
            4000
        );

    }, 3000);

}


// ===============================
// BOSS ATTACK TIMER
// ===============================

setInterval(() => {

    if (scene === "battle") {
        bossAttack();
    }

}, 1300);


// ===============================
// PART 5
// ===============================

function showPart5() {

    scene = "ending";

    transitionTitle.textContent = "PART 5 WAKE UP???";

    transition.style.display = "flex";

    setTimeout(() => {

        transition.style.display = "none";

        ending.style.display = "flex";

    }, 3000);

}


// ===============================
// STORY START
// ===============================

function startStory() {

    scene = "town";

    say(
        "🧙 Wizard: We are finally back in Grape Town!",
        3500
    );

    setTimeout(() => {

        say(
            "🧙 Wizard: Let's celebrate with magical grapes!",
            3500
        );

    }, 4000);

    setTimeout(() => {

        say(
            "🧙‍♂️ Super Wizard: BEHOLD! MAGICAL GRAPE RAIN!",
            3500
        );

    }, 8000);

    setTimeout(() => {

        say(
            "🍇 Everyone grabs a magical grape and eats it!",
            3500
        );

    }, 12000);

    setTimeout(() => {

        say(
            "🌑 Suddenly... BLACK FOG spreads everywhere!",
            3500
        );

    }, 16000);

    setTimeout(() => {

        say(
            "🍋 Mysterious Person: You finally figured it out...",
            3500
        );

    }, 20000);

    setTimeout(() => {

        say(
            "🍋 Mysterious Person: I was the lemonade seller all along!",
            4500
        );

    }, 24000);

    setTimeout(() => {

        startBoss();

    }, 29000);

}


// ===============================
// DRAW
// ===============================

function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    if (scene === "town") {

        drawTown();
        drawDuck();

    }

    else if (scene === "battle") {

        drawBattle();

    }

}


// ===============================
// GAME LOOP
// ===============================

function gameLoop() {

    movePlayer();

    if (scene === "battle") {

        updatePlayerAttacks();
        updateBossAttacks();

    }

    draw();

    requestAnimationFrame(gameLoop);

}


// ===============================
// START GAME
// ===============================

updateHUD();

startStory();

gameLoop();

</script>

</body>
</html>
